name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (CPU torch, same pins as requirements-train.txt)
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 pandas==2.2.3 opencv-python-headless==4.10.0.84 \
                      albumentations==2.0.8 timm==1.0.27 scikit-learn pyyaml pytest
      - name: Compile all sources
        run: python -m py_compile src/*.py
      - name: Unit tests
        run: pytest tests/ -q
